<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All ES6 Topics - One File</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h2 {
      color: #1a237e;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .card {
      background-color: #ffffff;
      border-left: 5px solid #1a237e;
      border-radius: 10px;
      padding: 15px 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .card h3 {
      margin: 0 0 8px 0;
      color: #1a237e;
      font-size: 16px;
    }

    .card p {
      margin: 4px 0;
      color: #222;
      font-size: 14px;
      line-height: 1.4;
      font-family: Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="container" id="output">
    <h2>ES6+ All Topics - Live Output</h2>
  </div>

  <script>
    const output = document.getElementById("output");

    function addCard(title, lines) {
      const card = document.createElement("div");
      card.className = "card";

      const heading = document.createElement("h3");
      heading.textContent = title;
      card.appendChild(heading);

      lines.forEach(line => {
        const p = document.createElement("p");
        p.textContent = line;
        card.appendChild(p);
      });

      output.appendChild(card);
    }

    // 1. Arrow Function
    const double = x => x * 2;
    addCard("1. Arrow Function", [
      "const double = x => x*2",
      double(5) = ${double(5)}
    ]);
</script>
</body>
</html>
