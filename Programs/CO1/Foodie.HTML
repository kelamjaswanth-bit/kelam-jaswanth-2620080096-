<!DOCTYPE html>
<html>
<head>
    <title>FoodieHub - Food Ordering</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <h1>FoodieHub 🍔</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#menu">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Welcome Section -->
    <section class="hero">

        <h2>Delicious Food, Delivered Fresh!</h2>

        <p>Enjoy your favourite food at your doorstep.</p>

        <button>Order Now</button>

    </section>

    <!-- Food Menu Section -->
    <section class="menu" id="menu">

        <h2>Our Special Menu</h2>

        <div class="food-container">

            <!-- Food Item 1 -->
            <div class="food-card">

                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500">

                <h3>Cheese Burger</h3>

                <p>₹149</p>

                <button>Order Now</button>

            </div>

            <!-- Food Item 2 -->
            <div class="food-card">

                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500">

                <h3>Pizza</h3>

                <p>₹249</p>

                <button>Order Now</button>

            </div>

            <!-- Food Item 3 -->
            <div class="food-card">

                <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500">

                <h3>Fresh Salad</h3>

                <p>₹129</p>

                <button>Order Now</button>

            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer>

        <p>© 2026 FoodieHub. All Rights Reserved.</p>

    </footer>

</body>
</html>
